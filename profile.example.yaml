# Copy to profile.yaml and fill in your company's facts.
# Eligibility checks and drafted applications use ONLY what is written here: be specific and truthful.
# Missing facts appear as [[NEEDS: ...]] placeholders in drafts instead of being invented.
name: ""                 # company name
one_liner: ""            # what you do, for whom
description: >
  Problem, solution and how the product works.
stage: pre-seed          # idea | pre-seed | seed | series A | series B+
sectors: []              # e.g. [agritech, AI]
country: ""              # country of incorporation / headquarters
regions_served: []
founded_year: null
team: []                 # one entry per person: role and relevant experience
funding_raised: ""
traction: []             # users, pilots, revenue, partnerships
goals: []                # e.g. non-dilutive funding, cloud credits, mentorship
exclude_keywords: []     # never show programs that mention these
writing_samples: []      # optional: past application answers, to match your voice
